; Android sideload + iOS TestFlight presets. Open in Godot 4.3+, install
; Export Templates, then Project → Export. See README, export/README.md,
; and docs/IOS_TESTFLIGHT.md.
; Gradle is OFF so the first APK does not need an Android build template.
; No secrets are stored here.
;
; iOS App Store Team ID, provisioning profile UUIDs, and code-sign
; identities MUST be filled on Mac.lan (Ronald's enrolled Apple team).
; Godot 4.3 will refuse to export while application/app_store_team_id
; is empty. Do not commit a team id or profile UUID.

