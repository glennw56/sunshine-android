; Android sideload + Play Store presets, plus the iOS preset.
; Open in Godot 4.3.stable (not 4.7). Install matching Export Templates,
; then Project → Export. See README / export/README.md / docs/PLAY_STORE.md
; / docs/IOS_RELEASE.md.
; Gradle is ON for both presets so the Poing AdMob Android plugin ships.
; Release keystore passwords are NEVER stored here.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*,docs/*,*.md,.env.example,scenes/dev/*,export/*,assets/reference/*,addons/admob/gdscript/sample/*,addons/admob/csharp/*,addons/admob/docs/*"
export_path="export/sunshines-bakery.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
