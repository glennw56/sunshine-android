; Android sideload + Play Store presets. Open in Godot 4.3+, install Export
; Templates, then Project → Export. See README / export/README.md /
; docs/PLAY_STORE.md.
; Gradle is ON for both presets so the Poing AdMob Android plugin ships.
; Release keystore passwords are NEVER stored here.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*,docs/*,*.md,.env.example,scenes/dev/*,export/*,assets/reference/*,addons/admob/gdscript/sample/*,addons/admob/csharp/*,addons/admob/docs/*"
export_path="export/sunshines-bakery.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
version/code=60
version/name="0.1.59"
package/unique_name="shop.sunshines.bakery"
package/name="Sunshine's Bakery"
package/signed=true
package/app_category=0
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
launcher_icons/main_192x192="res://assets/branding/icon-192.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
screen/background_color=Color(0.91, 0.71, 0.72, 1)
command_line/extra_args=""
apk_expansion/enable=false
permissions/custom_permissions=PackedStringArray()
permissions/access_network_state=true
permissions/internet=true
permissions/post_notifications=true

